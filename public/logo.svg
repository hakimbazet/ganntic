<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="copper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c2785a"/>
      <stop offset="100%" stop-color="#d9967e"/>
    </linearGradient>
    <linearGradient id="copperLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d9967e"/>
      <stop offset="100%" stop-color="#e8b8a0"/>
    </linearGradient>
  </defs>

  {/* Background cell */}
  <rect x="4" y="4" width="56" height="56" rx="14" fill="#0c0c0f" stroke="url(#copper)" stroke-width="2"/>

  {/* Grid squares (Excel DNA) — left side */}
  <rect x="14" y="18" width="10" height="10" rx="2" fill="url(#copper)" opacity="0.9"/>
  <rect x="14" y="30" width="10" height="10" rx="2" fill="url(#copper)" opacity="0.5"/>
  <rect x="26" y="18" width="10" height="10" rx="2" fill="url(#copper)" opacity="0.7"/>
  <rect x="26" y="30" width="10" height="10" rx="2" fill="url(#copper)" opacity="0.3"/>

  {/* Sweeping morph arrow */}
  <path d="M 22 28 Q 32 28 38 24" fill="none" stroke="url(#copperLight)" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="36,21 42,23 38,27" fill="url(#copperLight)"/>

  {/* Gantt bars (Timeline DNA) — right side */}
  <rect x="38" y="20" width="14" height="6" rx="3" fill="url(#copper)"/>
  <rect x="38" y="32" width="10" height="6" rx="3" fill="url(#copper)" opacity="0.6"/>
</svg>
